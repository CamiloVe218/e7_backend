services:
  # ─── Backend NestJS ──────────────────────────────────────────────────────────
  - type: web
    name: servicios-app-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/src/main
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: servicios-app-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 4000
      - key: FRONTEND_URL
        value: https://servicios-app-frontend.onrender.com

databases:
  # ─── PostgreSQL gestionado por Render ────────────────────────────────────────
  - name: servicios-app-db
    databaseName: servicios_db
    user: servicios
    plan: free
    region: oregon
